apiVersion: apps/v1
kind: Deployment
name: catalog

defaults: &defaults
  restartPolicy: Always
  terminationGracePeriodSeconds: 30
  labels:
    tier: backend
    managed: true

probes: &probes
  liveness:
    path: /healthz
    port: 8080
  readiness:
    path: /ready
    port: 8080

metadata:
  name: front-end
  annotations:
    owner: platform-team
    revision: 17
  labels:
    app: front-end
    release: stable

spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: front-end
  template:
    metadata:
      name: front-end-pod
      labels:
        app: front-end
    spec:
      <<: *defaults
      name: front-end-spec
      containers:
        - name: front-end
          image: "front-end:1.0.1"
          command: ["/bin/sh", "-c", "run"]
          args:
            - --verbose
            - --config=/etc/app/config.yaml
          probes:
            <<: *probes
            startup:
              path: /start
              port: 8080
          resources:
            requests:
              memory: 64Mi
              cpu: 250m
            limits:
              memory: 128Mi
              cpu: 500m
          env:
            - name: BROKER_URL
              value: "https://broker-service.info"
            - name: RETRIES
              value: 5
            - name: DEBUG
              value: false
            - name: EMPTY
              value: null
          ports:
            - containerPort: 8081
              protocol: TCP
            - containerPort: 8443
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/app
        - name: sidecar
          image: "sidecar:0.4.0"
          command: []
          args: ["--quiet"]
          resources:
            requests:
              memory: 32Mi
              cpu: 100m
            limits:
              memory: 64Mi
              cpu: 200m
          ports:
            - containerPort: 9000
      volumes:
        - name: config
          configMap:
            name: front-end-config
            items:
              - key: config.yaml
                path: config.yaml

matrix:
  - [1, 2, 3]
  - [4, 5, 6]
  - - 7
    - 8
    - 9

cube:
  - - [1, 2]
    - [3, 4]
  - - [5, 6]
    - [7, 8]

deep:
  - - level: 3
      name: array-in-array-object
      items:
        - level: 5
          name: object-in-array
          entries:
            - level: 7
              name: array-in-object
              detail:
                level: 8
                name: deepest

collections:
  stringsOnly: [one, two, three]
  numbersOnly: [10, 20, 30]
  flags: [true, false]
  single: [42]
  emptyList: []
  emptyMap: {}
  emptyText: ""
  nothing: null
  mixed: [1, "two", true, null]

unicode:
  tr: İstanbul çğıöşü
  jp: 日本語のテキスト
  emoji: "🚀 ✅ ☕"

numbers:
  big: 9007199254740993
  negative: -17
  float: 3.14159
  exponent: 1e10
  hex: 0x1F

test: ["abc", 123, "def", 456]
